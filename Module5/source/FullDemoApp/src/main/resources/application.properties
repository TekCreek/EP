spring.application.name=FullDemoApp

# Database Configuration
spring.datasource.url=jdbc:mysql://${HOSTNAME:localhost}:3306/sampledb
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT Secret
jwt.secret=supersecret_for_this_application_developed_in_2026
jwt.expiration=3600000

# ActiveMQ Configuration
spring.activemq.broker-url=tcp://${HOSTNAME:localhost}:61616
spring.activemq.user=publisher
spring.activemq.password=publisher123
spring.activemq.pool.enabled=true
spring.activemq.pool.max-connections=10

# JMS Configuration
spring.jms.template.default-destination=queue.signup
spring.jms.template.delivery-mode=persistent
spring.jms.listener.acknowledge-mode=auto
