name: ep-stack

services:
  app:
    build:
      context: ..          # points to the parent folder where Dockerfile lives
      dockerfile: Dockerfile
    image: my-spring-app:latest
    container_name: my-spring-app

    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - LOG_PATH=/app/logs          # matches the logback default — explicit is safer

    ports:
      - "8080:8080"

    volumes:
      # Mount  docker/vol/logs  →  /app/logs  inside the container
      - ./vol/logs:/app/logs

    # Ensure the host folder exists before the container starts
    # (Docker creates it automatically, but explicit is cleaner in teams)
    restart: unless-stopped