# ============================================================
# ActiveMQ Log4j2 Configuration
# ============================================================

# Root logger
rootLogger.level = INFO
rootLogger.appenderRef.out.ref = out
rootLogger.appenderRef.file.ref = file

# ============================================================
# Appenders
# ============================================================

# Console appender
appender.out.type = Console
appender.out.name = out
appender.out.layout.type = PatternLayout
appender.out.layout.pattern = %d{ISO8601} | %-5p | %-10.10t | %-32.32c{1} | %m%n

# Rolling file appender
appender.file.type = RollingFile
appender.file.name = file
appender.file.fileName = ${activemq.data}/../logs/activemq.log
appender.file.filePattern = ${activemq.data}/../logs/activemq.log.%d{yyyy-MM-dd}.gz
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{ISO8601} | %-5p | %-10.10t | %-32.32c{1} | %m%n
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1
appender.file.policies.time.modulate = true
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 14

# ============================================================
# Loggers
# ============================================================

# ActiveMQ core
logger.activemq.name = org.apache.activemq
logger.activemq.level = INFO

# Kahadb storage (set to WARN to reduce noise)
logger.kahadb.name = org.apache.activemq.store.kahadb
logger.kahadb.level = WARN

# ActiveMQ transport
logger.transport.name = org.apache.activemq.transport
logger.transport.level = WARN

# Spring framework
logger.spring.name = org.springframework
logger.spring.level = WARN

# Jetty web server
logger.jetty.name = org.eclipse.jetty
logger.jetty.level = WARN

# ActiveMQ Broker
logger.broker.name = org.apache.activemq.broker
logger.broker.level = INFO

# Set to DEBUG for message-level tracing (⚠️ very verbose)
# logger.activemq.level = DEBUG
