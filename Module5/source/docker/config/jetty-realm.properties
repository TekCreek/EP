# ============================================================
# Jetty Realm Properties - ActiveMQ Web Console Credentials
# ============================================================
# Format: username: password[,rolename ...]
#
# Roles used by ActiveMQ web console:
#   admin - Full admin access (required for /admin)
#   user  - Read-only access
#
# ⚠️  CHANGE THESE CREDENTIALS IN PRODUCTION!
# ============================================================

admin: admin, admin
user: user, user
