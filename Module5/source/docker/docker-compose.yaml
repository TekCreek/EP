name: ep-stack

services:
  activemq:
    image: apache/activemq-classic:5.18.3
    container_name: activemq
    restart: unless-stopped
    ports:
      - "61616:61616"   # OpenWire (JMS)
      - "61613:61613"   # STOMP
      - "61614:61614"   # STOMP over WebSocket
      - "1883:1883"     # MQTT
      - "5672:5672"     # AMQP
      - "8161:8161"     # Web Console (Admin UI)
    environment:
      ACTIVEMQ_OPTS: >-
        -Xms512m
        -Xmx1g
        -Djetty.host=0.0.0.0
        -Dactivemq.data=/opt/activemq/data
        -Dactivemq.conf=/opt/activemq/conf
    volumes:
      - ./config/activemq.xml:/opt/activemq/conf/activemq.xml:ro
      - ./config/jetty-realm.properties:/opt/activemq/conf/jetty-realm.properties:ro
      - ./config/log4j2.properties:/opt/activemq/conf/log4j2.properties:ro
      - ./vol/activemq-data:/opt/activemq/data
      - ./vol/activemq-logs:/opt/activemq/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8161/admin/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - activemq-net

  mysql-server-80:
    image: mysql/mysql-server:8.0
    volumes:
      - ./vol/db:/var/lib/mysql
      - ./vol/docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_ROOT_HOST=% 
  redis:
    image: redis:7-alpine # Using a specific, lightweight image version is recommended
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379" # Maps host port 6379 to container port 6379
    volumes:
      - ./vol/redis-data:/data # Named volume for data persistence
    command: redis-server --appendonly yes # Enables Append-Only File (AOF) persistence

volumes:
  activemq-data:
    driver: local
  activemq-logs:
    driver: local

networks:
  activemq-net:
    driver: bridge